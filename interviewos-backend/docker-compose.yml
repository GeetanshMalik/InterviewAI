version: "3.9"

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./data/code_execution:/app/data/code_execution
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./data/code_execution:/app/data/code_execution
    command: python -m workers.workflow_worker
